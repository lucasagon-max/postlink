<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar no PostLink</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

  <header class="navbar">
    <div class="container nav-content">
      <a href="/painel/" class="brand-logo">
        <i class="ti ti-link"></i>
        <span>PostLink</span>
      </a>
      <a href="/termos/" class="btn btn-ghost btn-sm">Ajuda</a>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px;">
    <div class="card" style="max-width:400px; width:100%;">
      
      <div style="text-align:center; margin-bottom:24px;">
        <h1 style="font-size:18px; font-weight:600; margin-bottom:6px;">Acesse seu painel</h1>
        <p style="color:var(--text-secondary); font-size:13px; line-height:1.45;">
          Digite seu e-mail para receber um link de acesso seguro sem senhas.
        </p>
      </div>

      <!-- Formulário de Envio -->
      <form id="form-login">
        <div class="fld">
          <label class="lb" for="input-email">E-mail comercial</label>
          <input
            id="input-email"
            type="email"
            placeholder="seu@negocio.com.br"
            required
            autocomplete="email"
          />
        </div>

        <button id="btn-enviar" type="submit" class="btn btn-primary" style="width:100%; margin-top:4px;">
          <span>Enviar Link Mágico</span>
          <span id="spinner-login" style="display:none;" class="spinner"></span>
        </button>
      </form>

      <!-- Feedback de Sucesso -->
      <div id="box-sucesso" style="display:none; text-align:center; padding:12px 0;">
        <div style="width:44px; height:44px; border-radius:50%; background:var(--bg-success); color:var(--text-success); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:22px;">
          <i class="ti ti-mail-check"></i>
        </div>
        <h2 style="font-size:15px; font-weight:600; margin-bottom:6px;">Link enviado com sucesso!</h2>
        <p style="color:var(--text-secondary); font-size:13px; line-height:1.45;">
          Enviamos um link de login para <strong id="email-confirmado" style="color:var(--text-primary);"></strong>.<br>
          Basta clicar no link do e-mail para entrar automaticamente no seu painel.
        </p>
        <button id="btn-reenviar" class="btn btn-secondary btn-sm" style="margin-top:16px;">
          Tentar outro e-mail
        </button>
      </div>

      <div style="margin-top:24px; text-align:center; border-top:0.5px solid var(--border); padding-top:14px;">
        <p style="font-size:12px; color:var(--text-muted);">
          Ao entrar, você concorda com nossos <a href="/termos/" style="color:var(--text-secondary); text-decoration:underline;">Termos</a> e <a href="/privacidade/" style="color:var(--text-secondary); text-decoration:underline;">Privacidade</a>.
        </p>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script type="module">
    import { getSupabase } from '/assets/js/supabase-config.js';

    const sb = getSupabase();
    const form = document.getElementById('form-login');
    const inputEmail = document.getElementById('input-email');
    const btnEnviar = document.getElementById('btn-enviar');
    const boxSucesso = document.getElementById('box-sucesso');
    const emailConfirmado = document.getElementById('email-confirmado');
    const btnReenviar = document.getElementById('btn-reenviar');

    function toast(mensagem, tipo = 'info') {
      const c = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${tipo}`;
      el.textContent = mensagem;
      c.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    async function checarSessao() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        window.location.href = '/painel/';
      }
    }
    checarSessao();

    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        window.location.href = '/painel/';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = inputEmail.value.trim();
      if (!email) return;

      btnEnviar.disabled = true;

      try {
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: window.location.origin + '/painel/',
          },
        });

        if (error) throw error;

        emailConfirmado.textContent = email;
        form.style.display = 'none';
        boxSucesso.style.display = 'block';
      } catch (err) {
        toast(err.message || 'Erro ao enviar o link. Tente novamente.', 'error');
      } finally {
        btnEnviar.disabled = false;
      }
    });

    btnReenviar.addEventListener('click', () => {
      boxSucesso.style.display = 'none';
      form.style.display = 'block';
      inputEmail.focus();
    });
  </script>

</body>
</html>
